<!doctype html>
<html class="h-full bg-surface" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Registra tu Empresa - JobNet</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              surface: "#f9f9ff",
              "on-tertiary-container": "#d9d8ff",
              secondary: "#006c49",
              "on-secondary-fixed": "#002113",
              "on-secondary-container": "#00714d",
              "on-surface": "#111c2d",
              error: "#ba1a1a",
              tertiary: "#3130c0",
              "surface-tint": "#4d44e3",
              "primary-container": "#4f46e5",
              "inverse-on-surface": "#ecf1ff",
              "tertiary-container": "#4b4dd8",
              "on-background": "#111c2d",
              "on-error-container": "#93000a",
              "surface-container-highest": "#d8e3fb",
              "primary-fixed-dim": "#c3c0ff",
              background: "#f9f9ff",
              "on-primary-container": "#dad7ff",
              primary: "#3525cd",
              "error-container": "#ffdad6",
              "surface-container": "#e7eeff",
              "on-primary-fixed": "#0f0069",
              "secondary-fixed-dim": "#4edea3",
              "on-tertiary-fixed-variant": "#2f2ebe",
              "on-secondary-fixed-variant": "#005236",
              "surface-variant": "#d8e3fb",
              "on-secondary": "#ffffff",
              "surface-dim": "#cfdaf2",
              "on-surface-variant": "#464555",
              "on-tertiary": "#ffffff",
              "on-error": "#ffffff",
              "inverse-primary": "#c3c0ff",
              "surface-container-high": "#dee8ff",
              "on-primary-fixed-variant": "#3323cc",
              "secondary-fixed": "#6ffbbe",
              "outline-variant": "#c7c4d8",
              "surface-bright": "#f9f9ff",
              "inverse-surface": "#263143",
              "primary-fixed": "#e2dfff",
              outline: "#777587",
              "tertiary-fixed": "#e1e0ff",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#f0f3ff",
              "secondary-container": "#6cf8bb",
              "on-tertiary-fixed": "#07006c",
              "on-primary": "#ffffff",
              "tertiary-fixed-dim": "#c0c1ff",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              sm: "0.5rem",
              "margin-mobile": "1rem",
              xs: "0.25rem",
              md: "1rem",
              "2xl": "3rem",
              xl: "2rem",
              base: "4px",
              lg: "1.5rem",
              gutter: "1.5rem",
              "container-max": "1280px",
            },
            fontFamily: {
              "headline-lg": ["Manrope"],
              display: ["Manrope"],
              "body-lg": ["Manrope"],
              "label-sm": ["Manrope"],
              "label-md": ["Manrope"],
              "headline-md": ["Manrope"],
              "body-sm": ["Manrope"],
              "body-md": ["Manrope"],
              "headline-sm": ["Manrope"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Manrope", sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      .form-input-focus:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
      }
    </style>
  </head>
  <body
    class="h-full selection:bg-primary-container selection:text-on-primary-container"
  >
    <div
      class="min-h-screen flex items-center justify-center p-gutter relative overflow-hidden"
      id="app"
    >
      <!-- Ambient Decorative Background -->
      <div class="absolute inset-0 pointer-events-none">
        <div
          class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-3xl"
        ></div>
        <div
          class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-secondary/5 rounded-full blur-3xl"
        ></div>
      </div>
      <main class="w-full max-w-lg z-10">
        <!-- Branding Header (TopAppBar Context) -->
        <div class="flex flex-col items-center mb-xl">
          <div class="flex items-center gap-sm mb-sm">
            <span class="material-symbols-outlined text-primary text-[32px]"
              >work</span
            >
            <h1
              class="font-headline-md text-headline-md font-extrabold text-primary tracking-tight"
            >
              JobNet
            </h1>
          </div>
        </div>
        <!-- Registration Card -->
        <div
          class="bg-surface-container-lowest p-xl md:p-2xl rounded-xl shadow-[0px_4px_6px_-1px_rgba(0,0,0,0.05)] border border-outline-variant/30"
        >
          <header class="mb-xl">
            <h2 class="font-headline-md text-headline-md text-on-surface mb-xs">
              Registra tu Empresa
            </h2>
            <p class="font-body-md text-body-md text-on-surface-variant">
              Encuentra el talento ideal para tu equipo
            </p>
          </header>
          <form @submit.prevent="handleSubmit" class="space-y-lg">
            <div class="space-y-sm">
              <label
                class="block font-label-md text-label-md text-on-surface-variant"
                for="company_name"
                >Nombre Comercial de la Empresa</label
              >
              <input
                class="w-full px-md py-sm bg-surface-container-low border border-outline-variant rounded-lg text-on-surface font-body-md placeholder:text-outline focus:outline-none form-input-focus transition-all"
                id="company_name"
                placeholder="Ej. TechFlow Solutions"
                required=""
                type="text"
                v-model="form.companyName"
              />
            </div>
            <div class="space-y-sm">
              <label
                class="block font-label-md text-label-md text-on-surface-variant"
                for="tax_id"
                >RFC o Identificador Fiscal</label
              >
              <input
                class="w-full px-md py-sm bg-surface-container-low border border-outline-variant rounded-lg text-on-surface font-body-md placeholder:text-outline focus:outline-none form-input-focus transition-all"
                id="tax_id"
                placeholder="A-000000000"
                required=""
                type="text"
                v-model="form.taxId"
              />
            </div>
            <div class="space-y-sm">
              <label
                class="block font-label-md text-label-md text-on-surface-variant"
                for="corporate_email"
                >Correo Electrónico Corporativo</label
              >
              <input
                class="w-full px-md py-sm bg-surface-container-low border border-outline-variant rounded-lg text-on-surface font-body-md placeholder:text-outline focus:outline-none form-input-focus transition-all"
                id="corporate_email"
                placeholder="reclutamiento@empresa.com"
                required=""
                type="email"
                v-model="form.email"
              />
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-md">
              <div class="space-y-sm">
                <label
                  class="block font-label-md text-label-md text-on-surface-variant"
                  for="password"
                  >Contraseña</label
                >
                <input
                  class="w-full px-md py-sm bg-surface-container-low border border-outline-variant rounded-lg text-on-surface font-body-md focus:outline-none form-input-focus transition-all"
                  id="password"
                  required=""
                  type="password"
                  v-model="form.password"
                />
              </div>
              <div class="space-y-sm">
                <label
                  class="block font-label-md text-label-md text-on-surface-variant"
                  for="confirm_password"
                  >Confirmar Contraseña</label
                >
                <input
                  class="w-full px-md py-sm bg-surface-container-low border border-outline-variant rounded-lg text-on-surface font-body-md focus:outline-none form-input-focus transition-all"
                  id="confirm_password"
                  required=""
                  type="password"
                  v-model="form.confirmPassword"
                />
              </div>
            </div>
            <div class="flex items-start gap-sm pt-xs">
              <div class="flex items-center h-5">
                <input
                  class="w-md h-md text-primary bg-surface-container-low border-outline-variant rounded focus:ring-primary focus:ring-2"
                  id="terms"
                  required=""
                  type="checkbox"
                  v-model="form.acceptTerms"
                />
              </div>
              <label
                class="font-body-sm text-body-sm text-on-surface-variant leading-tight"
                for="terms"
              >
                Acepto los
                <a
                  class="text-secondary font-medium hover:underline transition-colors"
                  href="#"
                  >Términos y Condiciones</a
                >
                y
                <a
                  class="text-secondary font-medium hover:underline transition-colors"
                  href="#"
                  >Aviso de Privacidad</a
                >
              </label>
            </div>
            <button
              class="w-full bg-primary-container text-white font-headline-sm text-headline-sm py-md rounded-lg shadow-md hover:shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-sm mt-md"
              type="submit"
            >
              Crear Cuenta Empresarial
              <span class="material-symbols-outlined" style="font-size: 20px"
                >arrow_forward</span
              >
            </button>
          </form>
          <footer class="mt-xl text-center">
            <p class="font-body-md text-body-md text-on-surface-variant">
              ¿Ya tienes una cuenta corporativa?
              <a
                class="text-primary font-bold hover:underline ml-xs transition-all"
                href="#"
                >Iniciar sesión</a
              >
            </p>
          </footer>
        </div>
        <!-- Micro-interaction Decorative Footer -->
        <div class="mt-lg flex justify-center gap-lg grayscale opacity-40">
          <div class="h-6 w-16 bg-outline-variant rounded"></div>
          <div class="h-6 w-16 bg-outline-variant rounded"></div>
          <div class="h-6 w-16 bg-outline-variant rounded"></div>
        </div>
      </main>
      <!-- Footer from Shared Components context -->
      <div
        class="fixed bottom-0 left-0 w-full p-md text-center hidden md:block"
      >
        <p class="font-label-sm text-label-sm text-on-surface-variant/60">
          © 2024 JobNet Professional Recruitment. All rights reserved.
        </p>
      </div>
    </div>
    <script>
      const { createApp, ref } = Vue;

      createApp({
        setup() {
          const form = ref({
            companyName: "",
            taxId: "",
            email: "",
            password: "",
            confirmPassword: "",
            acceptTerms: false,
          });

          const handleSubmit = () => {
            if (form.value.password !== form.value.confirmPassword) {
              alert("Las contraseñas no coinciden");
              return;
            }
          };

          return {
            form,
            handleSubmit,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>

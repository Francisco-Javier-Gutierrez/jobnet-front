<body class="h-full bg-background flex items-center justify-center p-margin-mobile md:p-0">
<!-- Isolated Centered Container -->
<main class="w-full max-w-[400px]">
<!-- JobNet Branding (Optional context above card) -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">JobNet</h1>
</div>
<!-- Verification Card (Level 2 Deep Shadow) -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_10px_15px_-3px_rgba(0,0,0,0.1)] p-xl border border-outline-variant/30">
<div class="text-center mb-xl">
<!-- Icon Highlight -->
<div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-primary-container/10 mb-md">
<span class="material-symbols-outlined text-primary" data-icon="mark_email_read">mark_email_read</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Verifica tu cuenta</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Ingresa el código de 6 dígitos que enviamos a tu correo</p>
</div>
<form class="space-y-xl">
<!-- OTP Input Area -->
<div class="flex justify-between gap-sm">
<input aria-label="Digit 1" autofocus="" class="w-12 h-14 text-center font-headline-md text-headline-md text-on-surface bg-[#F1F5F9] border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all" maxlength="1" type="text">
<input aria-label="Digit 2" class="w-12 h-14 text-center font-headline-md text-headline-md text-on-surface bg-[#F1F5F9] border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all" maxlength="1" type="text">
<input aria-label="Digit 3" class="w-12 h-14 text-center font-headline-md text-headline-md text-on-surface bg-[#F1F5F9] border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all" maxlength="1" type="text">
<input aria-label="Digit 4" class="w-12 h-14 text-center font-headline-md text-headline-md text-on-surface bg-[#F1F5F9] border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all" maxlength="1" type="text">
<input aria-label="Digit 5" class="w-12 h-14 text-center font-headline-md text-headline-md text-on-surface bg-[#F1F5F9] border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all" maxlength="1" type="text">
<input aria-label="Digit 6" class="w-12 h-14 text-center font-headline-md text-headline-md text-on-surface bg-[#F1F5F9] border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all" maxlength="1" type="text">
</div>
<!-- Action Button -->
<button class="w-full h-12 bg-primary text-on-primary font-label-md text-label-md rounded-lg shadow-[0px_4px_6px_-1px_rgba(0,0,0,0.05)] hover:shadow-[0px_10px_15px_-3px_rgba(0,0,0,0.1)] hover:-translate-y-0.5 active:translate-y-0 active:shadow-none transition-all duration-200 flex items-center justify-center" type="button">
                    Confirmar Registro
                </button>
</form>
<!-- Footer Action -->
<div class="mt-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    ¿No recibiste el código? 
                    <button class="font-label-md text-label-md text-primary hover:text-tertiary transition-colors ml-xs" type="button">Reenviar</button>
</p>
</div>
</div>
</main>
<script>
        // Simple auto-advance logic for OTP inputs
        const inputs = document.querySelectorAll('input[type="text"]');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if(e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if(e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>

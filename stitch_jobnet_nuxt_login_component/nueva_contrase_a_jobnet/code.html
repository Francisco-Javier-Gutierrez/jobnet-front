<!doctype html>
<html class="light" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>JobNet - Crea una nueva contraseña</title>
    <link

    />
    <link

      rel="stylesheet"
    />
    <link

    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {

              "on-secondary-fixed": "#002113",
              "on-error-container": "#93000a",
              "on-primary-container": "#dad7ff",
              "surface-container-highest": "#d8e3fb",
              secondary: "#006c49",
              "secondary-fixed": "#6ffbbe",
              "on-primary-fixed": "#0f0069",
              "primary-fixed": "#e2dfff",
              error: "#ba1a1a",
              tertiary: "#3130c0",
              "surface-tint": "#4d44e3",
              "surface-container-lowest": "#ffffff",
              "on-tertiary-fixed": "#07006c",
              "on-error": "#ffffff",
              "on-tertiary-fixed-variant": "#2f2ebe",
              surface: "#f9f9ff",
              "on-primary": "#ffffff",
              "error-container": "#ffdad6",
              primary: "#3525cd",
              "inverse-on-surface": "#ecf1ff",
              "tertiary-fixed-dim": "#c0c1ff",
              "on-tertiary-container": "#d9d8ff",
              "secondary-container": "#6cf8bb",
              background: "#f9f9ff",
              "secondary-fixed-dim": "#4edea3",
              "on-tertiary": "#ffffff",
              "tertiary-fixed": "#e1e0ff",
              "surface-variant": "#d8e3fb",
              "surface-container-low": "#f0f3ff",
              "surface-dim": "#cfdaf2",
              "surface-container-high": "#dee8ff",
              "on-secondary-fixed-variant": "#005236",
              "primary-container": "#4f46e5",
              "outline-variant": "#c7c4d8",
              "tertiary-container": "#4b4dd8",
              "on-background": "#111c2d",
              "on-surface-variant": "#464555",
              "on-secondary": "#ffffff",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              "margin-mobile": "1rem",
              "container-max": "1280px",
              md: "1rem",
              gutter: "1.5rem",
              xl: "2rem",
              sm: "0.5rem",
              lg: "1.5rem",
              base: "4px",
              "2xl": "3rem",
              xs: "0.25rem",
            },
            fontFamily: {
              "body-sm": ["Manrope"],
              "body-lg": ["Manrope"],
              "headline-lg-mobile": ["Manrope"],
              "body-md": ["Manrope"],
              "label-sm": ["Manrope"],
              "headline-md": ["Manrope"],
              display: ["Manrope"],
              "headline-sm": ["Manrope"],

            },
            fontSize: {

              display: [
                "48px",

                  lineHeight: "56px",

                },

    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-0"
  >
    <div
      class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl shadow-md p-xl flex flex-col gap-xl"
    >
      <div class="flex flex-col items-center text-center gap-sm">
        <div
          class="w-12 h-12 bg-surface-container-high rounded-full flex items-center justify-center mb-md"
        >
          <span
            class="material-symbols-outlined text-primary text-[28px]"
            data-icon="lock_reset"
            data-weight="fill"
            style="font-variation-settings: &quot;FILL&quot; 1"
            >lock_reset</span
          >
        </div>
        <h1
          class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background"
        >
          Crea una nueva contraseña
        </h1>
        <p class="font-body-md text-body-md text-on-surface-variant">
          Asegúrate de usar al menos 8 caracteres
        </p>
      </div>
      <form class="flex flex-col gap-lg" id="reset-form">
        <div class="flex flex-col gap-base">
          <label
            class="font-label-md text-label-md text-on-surface"
            for="confirmationCode"
            >Código de Confirmación</label
          >
          <div class="relative">
            <span
              class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant"
              data-icon="dialpad"
              >dialpad</span
            >
            <input
              class="w-full bg-[#F1F5F9] border border-[#F1F5F9] text-on-surface font-body-md text-body-md rounded-lg py-[10px] pl-[40px] pr-sm focus:border-primary-container focus:ring-4 focus:ring-primary-container/20 focus:bg-surface-container-lowest transition-all outline-none"
              id="confirmationCode"
              placeholder="Ingresa el código recibido"
              type="text"
            />
          </div>
        </div>
        <div class="flex flex-col gap-base">
          <label
            class="font-label-md text-label-md text-on-surface"
            for="newPassword"
            >Nueva Contraseña</label
          >
          <div class="relative">
            <span
              class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant"
              data-icon="lock"
              >lock</span
            >
            <input
              class="w-full bg-[#F1F5F9] border border-[#F1F5F9] text-on-surface font-body-md text-body-md rounded-lg py-[10px] pl-[40px] pr-[40px] focus:border-primary-container focus:ring-4 focus:ring-primary-container/20 focus:bg-surface-container-lowest transition-all outline-none"
              id="newPassword"
              placeholder="Tu nueva contraseña"
              type="password"
            />
            <button
              class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors"
              type="button"
            >
              <span
                class="material-symbols-outlined text-[20px]"
                data-icon="visibility_off"
                >visibility_off</span
              >
            </button>
          </div>
        </div>
        <div class="flex flex-col gap-base">
          <label
            class="font-label-md text-label-md text-on-surface"
            for="confirmPassword"
            >Confirmar Nueva Contraseña</label
          >
          <div class="relative">
            <span
              class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant"
              data-icon="lock_check"
              >lock_clock</span
            >
            <input
              class="w-full bg-[#F1F5F9] border border-[#F1F5F9] text-on-surface font-body-md text-body-md rounded-lg py-[10px] pl-[40px] pr-[40px] focus:border-primary-container focus:ring-4 focus:ring-primary-container/20 focus:bg-surface-container-lowest transition-all outline-none"
              id="confirmPassword"
              placeholder="Confirma tu nueva contraseña"
              type="password"
            />
            <button
              class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors"
              type="button"
            >
              <span
                class="material-symbols-outlined text-[20px]"
                data-icon="visibility_off"
                >visibility_off</span
              >
            </button>
          </div>
        </div>
        <button
          class="w-full h-[48px] bg-primary-container text-on-primary font-label-md text-label-md rounded-lg hover:shadow-md hover:-translate-y-[1px] active:translate-y-0 active:shadow-none transition-all mt-sm"
          type="submit"
        >
          Actualizar Contraseña
        </button>
      </form>
    </div>
    <script>
      document
        .getElementById("reset-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();
        });
    </script>
  </body>
</html>

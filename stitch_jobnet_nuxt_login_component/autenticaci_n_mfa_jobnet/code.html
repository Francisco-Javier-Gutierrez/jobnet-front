<!-- 6-digit input visual representation -->
<div class="flex gap-sm justify-between" id="otp-container">
<input autofocus="" class="w-12 h-14 text-center font-headline-md text-headline-md rounded-lg border border-outline-variant bg-surface-bright focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" maxlength="1" type="text">

<input class="w-12 h-14 text-center font-headline-md text-headline-md rounded-lg border border-outline-variant bg-surface-bright focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" maxlength="1" type="text">
<input class="w-12 h-14 text-center font-headline-md text-headline-md rounded-lg border border-outline-variant bg-surface-bright focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" maxlength="1" type="text">
<input class="w-12 h-14 text-center font-headline-md text-headline-md rounded-lg border border-outline-variant bg-surface-bright focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" maxlength="1" type="text">
<input class="w-12 h-14 text-center font-headline-md text-headline-md rounded-lg border border-outline-variant bg-surface-bright focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" maxlength="1" type="text">

<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary hover:underline transition-colors focus:outline-none focus:ring-2 focus:ring-primary rounded-sm p-xs inline-block" href="#">
                ¿Problemas con tu token? Contactar soporte
            </a>

<script>
        // Simple auto-advance for OTP inputs
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('#otp-container input');
            
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    // Only allow numbers
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');
                    
                    if (e.target.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });
                
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                        inputs[index - 1].focus();
                        inputs[index - 1].value = ''; // clear previous on backspace
                    }
                });
                
                // Allow pasting full 6 digits
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 6);
                    if (pastedData) {
                        for(let i = 0; i < pastedData.length; i++) {
                            if(inputs[i]) {
                                inputs[i].value = pastedData[i];
                                if(i < inputs.length - 1) inputs[i+1].focus();
                            }
                        }
                    }
                });
            });
        });
    </script>

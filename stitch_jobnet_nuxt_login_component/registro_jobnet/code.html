<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Únete a JobNet - Crear Cuenta</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#4f46e5",
                        "on-background": "#111c2d",
                        "surface-variant": "#d8e3fb",
                        "on-primary-fixed-variant": "#3323cc",
                        "surface-container-low": "#f0f3ff",
                        "surface": "#f9f9ff",
                        "tertiary-fixed": "#e1e0ff",
                        "secondary": "#006c49",
                        "on-primary-fixed": "#0f0069",
                        "outline": "#777587",
                        "surface-container": "#e7eeff",
                        "surface-bright": "#f9f9ff",
                        "on-error-container": "#93000a",
                        "inverse-on-surface": "#ecf1ff",
                        "tertiary-fixed-dim": "#c0c1ff",
                        "tertiary": "#3130c0",
                        "surface-container-high": "#dee8ff",
                        "primary-fixed": "#e2dfff",
                        "on-primary": "#ffffff",
                        "on-surface-variant": "#464555",
                        "surface-dim": "#cfdaf2",
                        "on-primary-container": "#dad7ff",
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#00714d",
                        "error": "#ba1a1a",
                        "on-surface": "#111c2d",
                        "secondary-fixed-dim": "#4edea3",
                        "primary-fixed-dim": "#c3c0ff",
                        "on-secondary-fixed": "#002113",
                        "inverse-surface": "#263143",
                        "on-tertiary-fixed": "#07006c",
                        "secondary-fixed": "#6ffbbe",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-tertiary-container": "#d9d8ff",
                        "on-secondary-fixed-variant": "#005236",
                        "tertiary-container": "#4b4dd8",
                        "on-error": "#ffffff",
                        "surface-tint": "#4d44e3",
                        "outline-variant": "#c7c4d8",
                        "secondary-container": "#6cf8bb",
                        "primary": "#3525cd",
                        "inverse-primary": "#c3c0ff",
                        "surface-container-highest": "#d8e3fb",
                        "surface-container-lowest": "#ffffff",
                        "background": "#f9f9ff",
                        "on-tertiary-fixed-variant": "#2f2ebe"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "0.5rem",
                        "base": "4px",
                        "gutter": "1.5rem",
                        "xs": "0.25rem",
                        "container-max": "1280px",
                        "md": "1rem",
                        "margin-mobile": "1rem",
                        "xl": "2rem",
                        "lg": "1.5rem",
                        "2xl": "3rem"
                    },
                    "fontFamily": {
                        "label-sm": ["Manrope"],
                        "headline-lg-mobile": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "display": ["Manrope"],
                        "headline-md": ["Manrope"],
                        "body-md": ["Manrope"],
                        "label-md": ["Manrope"],
                        "body-sm": ["Manrope"],
                        "headline-sm": ["Manrope"],
                        "headline-lg": ["Manrope"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "display": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #F8FAFC;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex items-center justify-center p-margin-mobile md:p-gutter font-body-md text-on-surface antialiased bg-[#F8FAFC]">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0px_4px_6px_-1px_rgba(0,0,0,0.05)] p-xl overflow-hidden relative">
<!-- Decorative Header -->
<div class="text-center mb-lg">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-surface-container-low text-primary mb-md">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 28px;">work</span>
</div>
<h1 class="font-headline-lg text-headline-lg md:font-headline-lg text-on-surface mb-xs">Únete a JobNet</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Crea tu cuenta para comenzar</p>
</div>
<!-- Role Selector (Tabs) -->
<div class="flex p-xs bg-surface-container rounded-lg mb-xl" role="tablist">
<button aria-selected="true" class="flex-1 py-sm px-md text-center rounded-md font-label-md text-label-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm" id="tab-candidato" onclick="switchTab('candidato')" role="tab" type="button">
                Candidato
            </button>
<button aria-selected="false" class="flex-1 py-sm px-md text-center rounded-md font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low" id="tab-empresa" onclick="switchTab('empresa')" role="tab" type="button">
                Empresa
            </button>
</div>
<!-- Form -->
<form action="#" class="space-y-md" method="POST">
<!-- Dynamic Fields Container -->
<div class="space-y-md" id="dynamic-fields">
<!-- Default (Candidato) Fields -->
<div class="form-group" id="field-fullname">
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="fullname">Nombre Completo</label>
<input class="w-full h-10 px-md bg-[#F1F5F9] border border-outline-variant rounded-DEFAULT font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="fullname" name="fullname" placeholder="Ej. Juan Pérez" required="" type="text">
</div>
</div>
<!-- Common Fields -->
<div class="form-group">
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Correo Electrónico</label>
<input class="w-full h-10 px-md bg-[#F1F5F9] border border-outline-variant rounded-DEFAULT font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="email" name="email" placeholder="tu@email.com" required="" type="email">
</div>
<div class="form-group mb-lg">
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="password">Contraseña</label>
<div class="relative">
<input class="w-full h-10 px-md bg-[#F1F5F9] border border-outline-variant rounded-DEFAULT font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" id="password" name="password" placeholder="Mínimo 8 caracteres" required="" type="password">
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-12 flex items-center justify-center bg-primary-container text-on-primary font-label-md text-label-md rounded-DEFAULT shadow-sm hover:shadow-md hover:-translate-y-[1px] active:shadow-sm active:translate-y-0 transition-all duration-200 mt-xl" type="submit">
                Crear Cuenta
            </button>
<!-- Terms Checkbox (Optional detail for realism) -->
<div class="flex items-start mt-sm">
<div class="flex items-center h-5">
<input class="w-4 h-4 text-primary-container bg-[#F1F5F9] border-outline-variant rounded focus:ring-primary-container focus:ring-2" id="terms" name="terms" required="" type="checkbox">
</div>
<div class="ml-sm font-body-sm text-body-sm">
<label class="text-on-surface-variant" for="terms">Acepto los <a class="text-primary hover:underline" href="#">Términos de Servicio</a> y <a class="text-primary hover:underline" href="#">Política de Privacidad</a>.</label>
</div>
</div>
</form>
<!-- Footer Link -->
<div class="mt-xl text-center font-body-sm text-body-sm text-on-surface-variant">
            ¿Ya tienes una cuenta? <a class="font-label-md text-label-md text-primary hover:underline focus:outline-none focus:ring-2 focus:ring-primary-container rounded-sm" href="#">Inicia sesión</a>
</div>
</div>
<script>
        function switchTab(role) {
            const tabCandidato = document.getElementById('tab-candidato');
            const tabEmpresa = document.getElementById('tab-empresa');
            const dynamicFields = document.getElementById('dynamic-fields');

            const activeClasses = ['bg-surface-container-lowest', 'text-primary', 'shadow-sm'];
            const inactiveClasses = ['text-on-surface-variant', 'hover:text-on-surface', 'hover:bg-surface-container-low'];

            // Reset tabs
            tabCandidato.classList.remove(...activeClasses);
            tabCandidato.classList.add(...inactiveClasses);
            tabCandidato.setAttribute('aria-selected', 'false');

            tabEmpresa.classList.remove(...activeClasses);
            tabEmpresa.classList.add(...inactiveClasses);
            tabEmpresa.setAttribute('aria-selected', 'false');

            if (role === 'candidato') {
                tabCandidato.classList.remove(...inactiveClasses);
                tabCandidato.classList.add(...activeClasses);
                tabCandidato.setAttribute('aria-selected', 'true');
                
                dynamicFields.innerHTML = `
                    <div class="form-group animate-[fadeIn_0.3s_ease-out]" id="field-fullname">
                        <label for="fullname" class="block font-label-md text-label-md text-on-surface mb-xs">Nombre Completo</label>
                        <input type="text" id="fullname" name="fullname" class="w-full h-10 px-md bg-[#F1F5F9] border border-outline-variant rounded-DEFAULT font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" placeholder="Ej. Juan Pérez" required>
                    </div>
                `;
            } else if (role === 'empresa') {
                tabEmpresa.classList.remove(...inactiveClasses);
                tabEmpresa.classList.add(...activeClasses);
                tabEmpresa.setAttribute('aria-selected', 'true');

                dynamicFields.innerHTML = `
                    <div class="form-group animate-[fadeIn_0.3s_ease-out]" id="field-company">
                        <label for="companyname" class="block font-label-md text-label-md text-on-surface mb-xs">Nombre de la Empresa</label>
                        <input type="text" id="companyname" name="companyname" class="w-full h-10 px-md bg-[#F1F5F9] border border-outline-variant rounded-DEFAULT font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors" placeholder="Ej. TechCorp S.A." required>
                    </div>
                `;
            }
        }
    </script>
<style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body></html>

<body class="h-full bg-[#F8FAFC] flex items-center justify-center p-margin-mobile md:p-gutter">
<div class="w-full max-w-md bg-surface-container-lowest rounded-lg shadow-[0px_4px_6px_-1px_rgba(0,0,0,0.05)] p-xl">
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-surface-container-low text-primary mb-md">
<span class="material-symbols-outlined text-[28px]" data-icon="lock_reset">lock_reset</span>
</div>
<h1 class="font-headline-lg text-headline-lg md:font-headline-lg md:text-headline-lg text-[#4F46E5] mb-sm">
                Recupera tu acceso
            </h1>
<p class="font-body-md text-body-md text-[#64748B]">
                Ingresa tu correo para recibir un código de restablecimiento
            </p>
</div>
<form @submit.prevent="submitForm" class="space-y-lg">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">
                    Correo electrónico
                </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-md bg-[#F1F5F9] font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-[#4F46E5] focus:border-[#4F46E5] focus:bg-surface-container-lowest transition-colors shadow-sm" id="email" name="email" placeholder="ejemplo@correo.com" required="" type="email">
</div>
</div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-label-md text-label-md text-white bg-[#4F46E5] hover:bg-opacity-90 hover:-translate-y-[1px] hover:shadow-md active:translate-y-0 active:shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#4F46E5] transition-all" type="submit">
                Enviar Código
            </button>
</form>
<div class="mt-lg text-center">
<a class="font-label-md text-label-md text-[#10B981] hover:underline flex items-center justify-center gap-xs transition-colors" href="#">
<span class="material-symbols-outlined text-[16px]" data-icon="arrow_back">arrow_back</span>
                Volver al inicio de sesión
            </a>
</div>
</div>
<script>
        // Placeholder for Nuxt 3 / Vue 3 composition API behavior if needed in static HTML context
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]" data-icon="progress_activity">progress_activity</span>';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = 'Código Enviado';
                btn.classList.replace('bg-[#4F46E5]', 'bg-[#10B981]');
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.replace('bg-[#10B981]', 'bg-[#4F46E5]');
                    btn.disabled = false;
                }, 2000);
            }, 1500);
        });
    </script>
